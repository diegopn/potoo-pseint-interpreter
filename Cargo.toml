[package]
name = "potoo-pseint-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-pseint-interpreter"
readme = "README.md"
description = "Initial scaffold for an independent Rust interpreter for the PSeInt pseudolanguage"

[lib]
path = "src/lib.rs"

[[bin]]
name = "potoo-pseint"
path = "src/bin/potoo-pseint.rs"
